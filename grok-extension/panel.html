<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --border: #dde1e7;
      --text: #202124;
      --text-muted: #5f6368;
      --primary: #1a73e8;
      --primary-dark: #1557b0;
      --primary-light: #e8f0fe;
      --danger: #d93025;
      --success: #137333;
      --success-light: #e6f4ea;
      --warning: #b06000;
      --warning-light: #fef7e0;
      --error-light: #fce8e6;
      --status-bg: #e8eaed;
    }
    [data-theme="dark"] {
      --bg: #1e1e1e;
      --card: #2d2d2d;
      --border: #444;
      --text: #e8eaed;
      --text-muted: #9aa0a6;
      --primary-light: #1a3557;
      --status-bg: #3c4043;
      --success-light: #1a3a28;
      --warning-light: #3a2a00;
      --error-light: #3a1a18;
    }
    * { box-sizing: border-box; }
    body {
      width: 100%; height: 100vh; padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      margin: 0; display: flex; flex-direction: column; font-size: 13px;
      transition: background 0.2s, color 0.2s;
      overflow-y: auto;
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .header h2 { margin: 0; color: var(--primary); font-size: 15px; font-weight: 700; }
    .header-actions { display: flex; gap: 5px; }
    .btn-icon {
      background: none; border: 1px solid var(--border); color: var(--text-muted);
      cursor: pointer; border-radius: 4px; padding: 4px 8px; font-size: 11px;
      transition: all 0.15s;
    }
    .btn-icon:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
    .section {
      background: var(--card); border: 1px solid var(--border);
      padding: 10px; border-radius: 6px; margin-bottom: 9px;
    }
    .section-title {
      font-weight: 700; font-size: 10px; color: var(--text-muted); margin-bottom: 8px;
      text-transform: uppercase; letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border); padding-bottom: 4px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .row { display: flex; gap: 8px; margin-bottom: 8px; }
    .col { flex: 1; display: flex; flex-direction: column; }
    label { font-size: 11px; margin-bottom: 3px; font-weight: 600; color: var(--text-muted); }
    select, input[type="text"], input[type="file"] {
      font-size: 12px; padding: 5px; width: 100%;
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      border-radius: 4px; transition: border-color 0.15s;
    }
    select:focus, input[type="text"]:focus { outline: none; border-color: var(--primary); }
    #prompt-list {
      overflow-y: auto; border: 1px solid var(--border);
      padding: 6px; background: var(--bg); border-radius: 4px;
      min-height: 100px; max-height: 260px;
    }
    .prompt-item {
      display: flex; flex-direction: column; margin-bottom: 6px;
      font-size: 12px; border-bottom: 1px solid var(--border); padding-bottom: 6px;
    }
    .prompt-item:last-child { border-bottom: none; margin-bottom: 0; }
    .prompt-header { display: flex; align-items: center; justify-content: space-between; }
    .prompt-header-left { display: flex; align-items: flex-start; flex-grow: 1; }
    .prompt-header-left input[type="checkbox"] { margin-right: 6px; margin-top: 2px; flex-shrink: 0; }
    .prompt-header-left label { word-break: break-word; font-weight: 600; color: var(--text); font-size: 12px; cursor: pointer; }
    .prompt-status {
      margin-left: 20px; margin-top: 3px; font-size: 10px;
      color: var(--text-muted); background: var(--status-bg);
      padding: 3px 7px; border-radius: 4px; display: inline-block; line-height: 1.4;
    }
    .status-running { background: var(--warning-light) !important; color: var(--warning) !important; }
    .status-done { background: var(--success-light) !important; color: var(--success) !important; }
    .status-error { background: var(--error-light) !important; color: var(--danger) !important; }
    #image-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; min-height: 4px; }
    .img-badge {
      background: var(--primary-light); color: var(--primary);
      border: 1px solid #d2e3fc; padding: 3px 8px; border-radius: 10px;
      font-size: 10px; display: flex; align-items: center; gap: 4px;
    }
    .img-badge button {
      background: none; border: none; color: var(--danger);
      cursor: pointer; font-weight: bold; padding: 0 2px; font-size: 13px; line-height: 1;
    }
    .progress-bar-wrap { height: 5px; background: var(--border); border-radius: 3px; margin-bottom: 5px; }
    .progress-bar { height: 100%; background: var(--primary); border-radius: 3px; transition: width 0.4s ease; width: 0%; }
    #progress-label { text-align: center; font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
    .btn-clear {
      background: none; border: none; color: var(--danger);
      font-size: 10px; cursor: pointer; text-decoration: underline; padding: 0;
    }
    .btn-action {
      background: none; border: none; color: var(--primary);
      font-size: 10px; cursor: pointer; text-decoration: underline; font-weight: bold; padding: 0;
    }
    .btn-primary {
      width: 100%; padding: 11px; background: var(--primary); color: white;
      border: none; cursor: pointer; font-weight: bold; border-radius: 5px;
      font-size: 13px; margin-top: 8px; margin-bottom: 6px; transition: background 0.2s;
    }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-primary:disabled { background: #9e9e9e; cursor: not-allowed; }
    .btn-row { display: flex; gap: 6px; margin-bottom: 6px; }
    .btn-stop {
      flex: 1; padding: 9px; background: var(--danger); color: white;
      border: none; cursor: pointer; font-weight: bold; border-radius: 5px;
      font-size: 12px; display: none; transition: background 0.2s;
    }
    .btn-stop:hover { background: #b52818; }
    .btn-pause {
      flex: 1; padding: 9px; background: #f9ab00; color: white;
      border: none; cursor: pointer; font-weight: bold; border-radius: 5px;
      font-size: 12px; display: none; transition: background 0.2s;
    }
    .btn-pause:hover { filter: brightness(0.9); }
    .btn-secondary {
      width: 100%; padding: 9px; background: var(--card); color: var(--primary);
      border: 1px solid var(--primary); cursor: pointer; font-weight: bold;
      border-radius: 5px; font-size: 12px; margin-bottom: 4px; transition: background 0.2s;
    }
    .btn-secondary:hover { background: var(--primary-light); }
  </style>
</head>
<body>
  <div class="header">
    <h2>&#9889; K-Brothers Grok</h2>
    <div class="header-actions">
      <button id="btn-export-log" class="btn-icon" title="Exportar log de resultados">&#128190; Log</button>
      <button id="btn-theme" class="btn-icon" title="Alternar tema claro/escuro">&#127774;</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Configurações</div>
    <div class="row">
      <div class="col">
        <label>Aspect Ratio</label>
        <select id="config-ratio">
          <option value="16:9">16:9</option>
          <option value="9:16">9:16</option>
          <option value="1:1">1:1</option>
          <option value="4:3">4:3</option>
        </select>
      </div>
      <div class="col">
        <label>Tipo de Média</label>
        <select id="config-media">
          <option value="image">Imagem</option>
          <option value="video">Vídeo</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="col" id="duration-container" style="display: none;">
        <label>Duração</label>
        <select id="config-duration">
          <option value="6s">6 segundos</option>
          <option value="10s">10 segundos</option>
        </select>
      </div>
      <div class="col" id="quality-container" style="display: none;">
        <label>Resolução</label>
        <select id="config-quality">
          <option value="720">Alta (720p)</option>
          <option value="480">Baixa (480p)</option>
        </select>
      </div>
      <div class="col">
        <label title="Sub-pasta criada dentro de Transferências">Pasta de Saída</label>
        <input type="text" id="config-folder" placeholder="Ex: Projeto_X">
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">
      Imagens de Referência
      <button id="btn-clear-images" class="btn-clear">Limpar tudo</button>
    </div>
    <input type="file" id="ref-images" accept="image/*" multiple>
    <div id="image-list"></div>
  </div>

  <div class="section" style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden;">
    <div class="section-title">
      Prompts &amp; Progresso
      <div>
        <button id="btn-select-all" class="btn-action" style="margin-right: 8px;">Marcar todos</button>
        <button id="btn-deselect-all" class="btn-action">Desmarcar</button>
      </div>
    </div>
    <input type="file" id="txt-file" accept=".txt,.html,.htm" style="margin-bottom: 6px;">
    <div id="progress-label" style="display: none;"></div>
    <div class="progress-bar-wrap" id="progress-wrap" style="display: none;">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div id="prompt-list" style="display: none;"></div>
  </div>

  <button id="start" class="btn-primary" disabled>&#9654; Iniciar Geração no Grok</button>

  <div class="btn-row">
    <button id="btn-pause" class="btn-pause">&#9646;&#9646; Pausar</button>
    <button id="btn-stop" class="btn-stop">&#9632; Parar</button>
  </div>

  <button id="btn-novo" class="btn-secondary">&#8635; Novo Projeto</button>

  <script src="panel.js"></script>
</body>
</html>
